<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gamerINFO — Git Tree Viewer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js für Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- GitHub Dark Markdown CSS für perfekte Formatierung -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: {
              DEFAULT: '#38bdf8', // Hellblau / Cyan
              hover: '#0ea5e9',
              glow: 'rgba(56, 189, 248, 0.15)'
            },
            darkbg: {
              DEFAULT: '#080c14',
              card: '#0d1322',
              border: '#1a233a'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Premium Glassmorphism & Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #080c14; }
    ::-webkit-scrollbar-thumb { background: #1a233a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
    
    .glass-panel {
      background: rgba(13, 19, 34, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(26, 35, 58, 0.8);
    }
    
    .markdown-body {
      background-color: transparent !important;
      color: #cbd5e1 !important;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif !important;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      border-bottom-color: #1a233a !important;
      color: #f8fafc !important;
    }
    .markdown-body code {
      background-color: rgba(56, 189, 248, 0.1) !important;
      color: #38bdf8 !important;
    }
    .markdown-body pre {
      background-color: #0b101d !important;
      border: 1px solid #1a233a !important;
    }
  </style>
</head>
<body class="bg-darkbg text-slate-100 h-screen flex flex-col overflow-hidden selection:bg-accent selection:text-darkbg">

  <!-- Header -->
  <header class="h-16 border-b border-darkbg-border bg-darkbg-card/90 backdrop-blur-md px-6 flex items-center justify-between shrink-0 z-20 shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-3.5 h-3.5 rounded-full bg-accent animate-pulse shadow-[0_0_15px_#38bdf8]"></div>
      <div>
        <h1 class="font-bold text-sm tracking-wide text-slate-100">gamerINFO</h1>
        <p class="text-[10px] text-slate-400 font-mono">gamer7521-official / gamerINFO</p>
      </div>
    </div>
    <div class="flex items-center space-x-4">
      <span id="file-count" class="px-3 py-1 rounded-full bg-darkbg border border-darkbg-border font-mono text-xs text-accent shadow-[0_0_10px_rgba(56,189,248,0.05)]">Lade Git-Tree...</span>
      <a href="https://github.com/gamer7521-official/gamerINFO" target="_blank" class="px-3 py-1.5 rounded-lg bg-accent/10 border border-accent/20 text-accent text-xs hover:bg-accent/20 transition-all flex items-center space-x-1.5">
        <span>GitHub Repo</span>
        <span>↗</span>
      </a>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar / Vollautomatischer Git Tree -->
    <aside class="w-80 border-r border-darkbg-border bg-darkbg-card/40 flex flex-col shrink-0">
      <div class="p-3 border-b border-darkbg-border bg-darkbg-card/60">
        <div class="relative">
          <input type="text" id="search-input" placeholder="Dateien im Tree suchen..." 
            class="w-full bg-darkbg border border-darkbg-border rounded-xl px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-accent transition-all shadow-inner">
          <span class="absolute right-3 top-2.5 text-xs text-slate-500">🔍</span>
        </div>
      </div>
      <div id="tree-container" class="flex-1 overflow-y-auto p-3 space-y-1 text-xs font-mono">
        <div class="text-slate-500 text-center py-10 animate-pulse">Lade Ordnerstruktur...</div>
      </div>
    </aside>

    <!-- Content Area -->
    <main id="content-area" class="flex-1 overflow-y-auto p-10 bg-darkbg relative">
      <!-- Welcome / Default State -->
      <div id="welcome-screen" class="max-w-xl mx-auto text-center py-24 glass-panel rounded-3xl p-8 shadow-2xl">
        <div class="w-16 h-16 rounded-2xl bg-accent/10 border border-accent/20 flex items-center justify-center mx-auto mb-5 text-accent text-3xl shadow-[0_0_25px_rgba(56,189,248,0.15)]">📂</div>
        <h2 class="text-xl font-bold text-slate-100 mb-2">Willkommen bei gamerINFO</h2>
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">Wähle links im automatischen Git-Tree eine Markdown-Datei aus, um sie im High-End Design anzuzeigen.</p>
        <div class="inline-flex items-center space-x-2 text-[11px] text-accent font-mono bg-accent/5 px-3 py-1.5 rounded-lg border border-accent/10">
          <span>⚡ Live-Synchronisation mit GitHub aktiv</span>
        </div>
      </div>
      
      <!-- Markdown Render Container -->
      <article id="markdown-viewer" class="markdown-body max-w-4xl mx-auto hidden glass-panel p-10 rounded-3xl shadow-2xl"></article>
    </main>

  </div>

  <script>
    const CONFIG = {
      owner: 'gamer7521-official',
      repo: 'gamerINFO',
      branch: 'main' // Fallback falls main, wird automatisch geprüft falls standard
    };

    let repoFiles = [];

    async function initViewer() {
      const treeContainer = document.getElementById('tree-container');
      try {
        // Versuche Branch 'main' zu laden, sonst 'master'
        let response = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/main?recursive=1`);
        if (!response.ok) {
          response = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/master?recursive=1`);
          CONFIG.branch = 'master';
        }
        if (!response.ok) throw new Error('Repository nicht gefunden oder API-Limit erreicht.');
        
        const data = await response.json();
        repoFiles = data.tree;
        
        document.getElementById('file-count').innerText = `${repoFiles.length} Elemente im Git-Tree`;
        
        const root = buildTreeStructure(repoFiles);
        treeContainer.innerHTML = '';
        renderTree(root, treeContainer, 0);

      } catch (error) {
        treeContainer.innerHTML = `<div class="p-4 text-red-400 text-center font-sans text-xs">Fehler beim Laden:<br>${error.message}</div>`;
      }
    }

    function buildTreeStructure(files) {
      const root = { name: '', path: '', type: 'tree', children: {} };
      files.forEach(file => {
        const parts = file.path.split('/');
        let current = root;
        parts.forEach((part, index) => {
          if (!current.children[part]) {
            current.children[part] = {
              name: part,
              path: parts.slice(0, index + 1).join('/'),
              type: index === parts.length - 1 ? file.type : 'tree',
              children: {}
            };
          }
          current = current.children[part];
        });
      });
      return root;
    }

    function renderTree(node, container, depth) {
      const sortedKeys = Object.keys(node.children).sort((a, b) => {
        const nodeA = node.children[a];
        const nodeB = node.children[b];
        if (nodeA.type === nodeB.type) return a.localeCompare(b);
        return nodeA.type === 'tree' ? -1 : 1;
      });

      sortedKeys.forEach(key => {
        const child = node.children[key];
        const itemDiv = document.createElement('div');
        itemDiv.className = 'select-none';

        if (child.type === 'tree') {
          itemDiv.innerHTML = `
            <div class="flex items-center space-x-2 py-1.5 px-2.5 rounded-xl hover:bg-accent/10 hover:text-accent cursor-pointer text-slate-300 transition-all group">
              <span class="text-accent group-hover:scale-110 transition-transform">📂</span>
              <span class="truncate font-medium">${child.name}</span>
            </div>
            <div class="pl-3 space-y-1 border-l border-darkbg-border ml-3 mt-0.5"></div>
          `;
          const childrenContainer = itemDiv.querySelector('div:last-child');
          itemDiv.querySelector('div:first-child').addEventListener('click', (e) => {
            e.stopPropagation();
            childrenContainer.classList.toggle('hidden');
          });
          renderTree(child, childrenContainer, depth + 1);
        } else {
          const isMd = child.name.endsWith('.md');
          itemDiv.innerHTML = `
            <div class="flex items-center space-x-2 py-1.5 px-2.5 rounded-xl hover:bg-accent/15 hover:text-accent cursor-pointer text-slate-400 transition-all ${isMd ? '' : 'opacity-50'}">
              <span>${isMd ? '📄' : '🔸'}</span>
              <span class="truncate">${child.name}</span>
            </div>
          `;
          if (isMd) {
            itemDiv.querySelector('div').addEventListener('click', () => loadMarkdownFile(child.path));
          }
        }
        container.appendChild(itemDiv);
      });
    }

    async function loadMarkdownFile(path) {
      const welcome = document.getElementById('welcome-screen');
      const viewer = document.getElementById('markdown-viewer');
      
      welcome.classList.add('hidden');
      viewer.classList.remove('hidden');
      viewer.innerHTML = `<div class="text-center py-20 text-slate-400 animate-pulse font-mono text-xs">Lade ${path}...</div>`;

      try {
        const res = await fetch(`https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${path}`);
        if (!res.ok) throw new Error('Datei konnte nicht geladen werden.');
        const markdownText = await res.text();
        viewer.innerHTML = marked.parse(markdownText);
      } catch (err) {
        viewer.innerHTML = `<div class="text-red-400 text-center py-20 font-sans">Fehler beim Laden der Datei: ${err.message}</div>`;
      }
    }

    // Live-Suchfunktion
    document.getElementById('search-input').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const treeContainer = document.getElementById('tree-container');
      
      if (!term) {
        treeContainer.innerHTML = '';
        renderTree(buildTreeStructure(repoFiles), treeContainer, 0);
        return;
      }

      const filteredFiles = repoFiles.filter(f => f.path.toLowerCase().includes(term));
      treeContainer.innerHTML = '<div class="px-2.5 py-1 text-slate-500 font-sans text-[10px] uppercase tracking-wider mb-2">Suchergebnisse</div>';
      
      filteredFiles.forEach(file => {
        const div = document.createElement('div');
        div.className = 'flex items-center space-x-2 py-1.5 px-2.5 rounded-xl hover:bg-accent/15 hover:text-accent cursor-pointer text-slate-300 transition-all truncate';
        div.innerHTML = `<span>${file.path.endsWith('.md') ? '📄' : '🔸'}</span><span class="truncate">${file.path}</span>`;
        if (file.path.endsWith('.md')) {
          div.addEventListener('click', () => loadMarkdownFile(file.path));
        }
        treeContainer.appendChild(div);
      });
    });

    initViewer();
  </script>
</body>
</html>
