<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Repo Tree Viewer</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Schickes, modernes Design (Vue-Theme) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Lade Repository-Struktur...</div>
  <script>
    window.$docsify = {
      name: 'gamerINFO',
      repo: 'gamer7521-official/gamerINFO', // Hier dein Repo eintragen
      loadSidebar: true,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      // Lädt automatisch eine _sidebar.md oder baut sie dynamisch auf
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugin für Emoji & Syntax-Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
